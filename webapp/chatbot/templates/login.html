{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="auth-container">
    <div class="auth-background"></div>
    
    <!-- 3D Robot Illustration -->
    <div class="auth-illustration">
        <!-- 3D Robot Container -->
        <div class="robot-container">
            <!-- Speech Bubble -->
            <div class="speech-bubble">
                Hi! Welcome back 👋
            </div>
            
            <!-- Robot Head with Antenna -->
            <div class="robot-head">
                <div class="robot-antenna"></div>
                <div class="robot-visor">
                    <div class="robot-eye left"></div>
                    <div class="robot-eye right"></div>
                </div>
            </div>
            
            <!-- Robot Body with Arms -->
            <div class="robot-body">
                <div class="robot-arm left"></div>
                <div class="robot-arm right"></div>
            </div>
        </div>
    </div>
    
    <div class="container">
        <div class="row justify-content-center align-items-center" style="min-height: 100%;">
            <div class="col-md-8 col-lg-7">
                <div class="auth-card" data-aos="zoom-in" data-aos-duration="600">
                    <div class="text-center mb-4" data-aos="fade-down" data-aos-delay="100">
                        <div class="auth-logo mb-3">
                            <i class="fas fa-brain"></i>
                        </div>
                        <h2 class="fw-bold mb-2">Welcome Back!</h2>
                        <p class="text-muted">We're here to support your wellness journey</p>
                    </div>
                    
                    <form method="post" class="auth-form">
                        {% csrf_token %}
                        
                        <div class="form-floating mb-3" data-aos="fade-up" data-aos-delay="200">
                            <input type="text" 
                                   class="form-control" 
                                   id="username" 
                                   name="username" 
                                   placeholder="Username" 
                                   required
                                   autocomplete="username">
                            <label for="username"><i class="fas fa-user me-2"></i>Username</label>
                        </div>
                        
                        <div class="form-floating mb-3 password-field" data-aos="fade-up" data-aos-delay="300">
                            <input type="password" 
                                   class="form-control" 
                                   id="password" 
                                   name="password" 
                                   placeholder="Password" 
                                   required
                                   autocomplete="current-password">
                            <label for="password"><i class="fas fa-lock me-2"></i>Password</label>
                            <button type="button" class="password-toggle" onclick="togglePassword('password')">
                                <i class="fas fa-eye" id="password-icon"></i>
                            </button>
                        </div>
                        
                        <div class="d-flex justify-content-between align-items-center mb-4" data-aos="fade-up" data-aos-delay="400">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="remember">
                                <label class="form-check-label small" for="remember">
                                    Remember me
                                </label>
                            </div>
                            <a href="#" class="small text-decoration-none">Forgot Password?</a>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 py-3 mb-3" data-aos="fade-up" data-aos-delay="500">
                            <i class="fas fa-sign-in-alt me-2"></i>Login
                        </button>
                    </form>
                    
                    <div class="text-center mt-4" data-aos="fade-up" data-aos-delay="600">
                        <p class="text-muted mb-0">
                            Don't have an account? 
                            <a href="{% url 'register' %}" class="fw-bold text-decoration-none" style="color: var(--primary);">Create Account</a>
                        </p>
                    </div>
                    
                    <div class="divider my-4" data-aos="fade-up" data-aos-delay="700">
                        <span>OR</span>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button class="btn btn-outline-secondary">
                            <i class="fab fa-google me-2"></i>Continue with Google
                        </button>
                        <button class="btn btn-outline-secondary">
                            <i class="fab fa-facebook me-2"></i>Continue with Facebook
                        </button>
                    </div>
                    
                    <div class="text-center mt-4">
                        <a href="{% url 'home' %}" class="btn btn-link text-muted">
                            <i class="fas fa-arrow-left me-2"></i>Back to Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Password visibility toggle
    function togglePassword(fieldId) {
        const field = document.getElementById(fieldId);
        const icon = document.getElementById(fieldId + '-icon');
        
        if (field.type === 'password') {
            field.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            field.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
</script>
{% endblock %}
