  - utter_default
  - action_suggest_activity
  - action_provide_quote
  - action_generate_report
  - action_crisis_resources
  - action_check_in
  - action_recommend_professional
  - action_breathing_guidance

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true